services:
  radar-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: flakyradar
      POSTGRES_USER: flakyradar
      POSTGRES_PASSWORD: flakyradar
    ports:
      - "5433:5432"
    volumes:
      - radar-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flakyradar"]
      interval: 5s
      retries: 10

  flaky-radar:
    profiles: ["app"]
    build: ./flaky-radar
    depends_on:
      radar-db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://radar-db:5432/flakyradar
      FLAKY_RADAR_ADMIN_TOKEN: ${FLAKY_RADAR_ADMIN_TOKEN:-change-me}
      FLAKY_RADAR_PUBLIC_URL: http://localhost:8080
      FLAKY_RADAR_TELEGRAM_ENABLED: ${FLAKY_RADAR_TELEGRAM_ENABLED:-false}
      FLAKY_RADAR_TELEGRAM_BOT_TOKEN: ${FLAKY_RADAR_TELEGRAM_BOT_TOKEN:-}
      FLAKY_RADAR_TELEGRAM_CHAT_ID: ${FLAKY_RADAR_TELEGRAM_CHAT_ID:-}
    ports:
      - "8080:8080"

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
    ports:
      - "5432:5432"

  isbn-service:
    image: wiremock/wiremock:3.13.1
    ports:
      - "8089:8080"
    volumes:
      - ./library-demo/wiremock:/home/wiremock

volumes:
  radar-data:

name: tests

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests (unit, slice, api, architecture) + coverage check
        run: mvn -B verify

      - name: Checkout gh-pages (history)
        if: always()
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Restore Allure history
        if: always()
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth=1 origin gh-pages
            mkdir -p target/allure-results
            git archive FETCH_HEAD history | tar -x -C target/allure-results || true
          else
            echo "Ветки gh-pages пока нет (первый прогон), история пропущена"
          fi

      - name: Build Allure report
        if: always()
        run: mvn -B allure:report

      - name: Add JaCoCo report into the site
        if: always()
        run: |
          if [ -d target/site/jacoco ]; then
            cp -r target/site/jacoco target/site/allure-maven-plugin/jacoco
          fi

      - name: Generate coverage badge
        if: always()
        uses: cicirello/jacoco-badge-generator@v2
        with:
          jacoco-csv-file: target/site/jacoco/jacoco.csv
          badges-directory: target/site/allure-maven-plugin/badges
          generate-coverage-badge: true
          coverage-badge-filename: coverage.svg

      - name: Publish to GitHub Pages
        if: always() && github.ref_name == github.event.repository.default_branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/allure-maven-plugin

spring:
  application:
    name: flaky-radar
  datasource:
    url: jdbc:postgresql://localhost:5433/flakyradar
    username: flakyradar
    password: flakyradar
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB
  threads:
    virtual:
      enabled: true

flaky-radar:
  admin-token: ${FLAKY_RADAR_ADMIN_TOKEN:change-me}
  public-url: ${FLAKY_RADAR_PUBLIC_URL:http://localhost:8080}
  detection:
    window: 30
    min-runs: 5
    min-flips: 3
    broken-streak: 3
  ingest:
    max-message-length: 4000
  telegram:
    enabled: ${FLAKY_RADAR_TELEGRAM_ENABLED:false}
    base-url: https://api.telegram.org
    bot-token: ${FLAKY_RADAR_TELEGRAM_BOT_TOKEN:}
    chat-id: ${FLAKY_RADAR_TELEGRAM_CHAT_ID:}
    timeout: 5s
    notify-on-pass: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
